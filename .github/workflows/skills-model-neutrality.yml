# Encodes docs/specs/0002-first-skills.md shared acceptance #2: CI fails if any
# file under skills/ names a model or model vendor. The pattern list lives in
# this check only. Case-insensitive with boundaries: the required .claude
# symlink folder, the allowed CLAUDE.md agent instruction filename, and ordinary
# words (architecture, doctor, ...) do not match. Only the CLAUDE.md token is
# neutralized before matching, so a model name elsewhere on the same line still
# fails; there are no whole-line exemptions. A grep or sed error (exit 2) fails
# the job instead of passing.

name: Skills model neutrality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  model-neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject model names and vendors under skills/
        run: |
          patterns='(^|[^a-zA-Z0-9.])(anthropic|xai|x\.ai|zhipu|deepmind|midjourney|mistral|'
          patterns+='openai|openrouter|nvidia|cohere|moonshot|minimax|google|meta|microsoft|'
          patterns+='perplexity|4o|chatgpt|gpt|claude|codex|dall[- ]?e|deepseek|ernie|'
          patterns+='gemini|glm|grok|haiku|kimi|llama|mixtral|o1|o3|o4|opus|phi|qwen|sonnet|'
          patterns+='gemma|nemotron|devstral|codestral|z\.ai|zai|nova|'
          patterns+='stable[- ]?diffusion)([^a-zA-Z]|$)'
          if [ ! -d skills ]; then
            echo "skills/ is absent; nothing to check."
            exit 0
          fi
          export LC_ALL=C
          # Narrow token preprocessing: the agent instruction filename CLAUDE.md
          # is allowed, so that exact token (case-insensitively) is neutralized
          # before matching. Nothing else is rewritten; a real model name on the
          # same line as CLAUDE.md still fails, and no whole line is exempt. The
          # .claude symlink folder stays exempt via the dot boundary in the
          # pattern.
          file_list="$(mktemp)"
          preprocessed="$(mktemp)"
          trap 'rm -f "$file_list" "$preprocessed"' EXIT
          find skills -type f -print0 > "$file_list" || {
            echo "::error::find failed; failing closed."
            exit 1
          }
          status=0
          while IFS= read -r -d '' file; do
            sed_status=0
            sed 's/CLAUDE\.md/AGENTFILE.md/gI' "$file" > "$preprocessed" || sed_status=$?
            if [ "$sed_status" -ne 0 ]; then
              echo "::error::sed exited $sed_status preprocessing $file; failing closed."
              exit 1
            fi
            grep_status=0
            grep -nHiE "$patterns" --label="$file" < "$preprocessed" || grep_status=$?
            if [ "$grep_status" -eq 0 ]; then
              status=1
            elif [ "$grep_status" -eq 1 ]; then
              :
            else
              echo "::error::grep exited $grep_status on $file (expected 0 or 1); failing closed."
              exit 1
            fi
          done < "$file_list"
          if [ "$status" -eq 0 ]; then
            echo "OK: no model names or model vendors under skills/."
            exit 0
          else
            echo "::error::skills/ names a model or model vendor; see the matched lines above (shown with the allowed CLAUDE.md token neutralized). Model choice belongs to the user's harness config, not to a skill."
            exit 1
          fi
